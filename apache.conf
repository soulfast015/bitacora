# Configuración Apache para AAPanel - Reverse Proxy a Next.js
# Agregar dentro de la configuración del VirtualHost en AAPanel
# Sitio > tu dominio > Configuración > Archivo de configuración

<VirtualHost *:80>
    ServerName 190.167.123.23
    # ServerName tu-dominio.com  # Descomentar y cambiar si tienes dominio

    ProxyPreserveHost On
    ProxyRequests Off

    # Proxy principal a Next.js
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    # WebSocket support (para hot reload en desarrollo, útil también en producción)
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:3000/$1 [P,L]

    # Headers de proxy
    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Logs
    ErrorLog /www/wwwlogs/bitacora.error.log
    CustomLog /www/wwwlogs/bitacora.access.log combined
</VirtualHost>
