# Configuración Nginx para AAPanel
# Copiar este contenido en: Sitio > tu dominio > Configuración > Archivo de configuración
# O crear un reverse proxy en AAPanel apuntando a localhost:3000

server {
    listen 80;
    server_name tu-dominio.com;  # Cambiar por tu dominio o IP

    # Logs
    access_log /www/wwwlogs/bitacora.access.log;
    error_log /www/wwwlogs/bitacora.error.log;

    # Tamaño máximo de upload
    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # Cache de assets estáticos
    location /_next/static {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
